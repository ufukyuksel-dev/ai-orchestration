id: illustrative-kvkk-001
version: "1.0.0"
source: "illustrative-kvkk"
legal_owner: "compliance-lab"
status: illustrative
effective_date: "2026-05-20"
rules:
  - id: kvkk-001
    title: "TCKN must not be logged"
    severity: critical
    pattern: "\\bTCKN\\b|tc kimlik|kimlik numarasi"
    description: "Illustrative KVKK rule; advisory-only until approved by compliance owner."
  - id: kvkk-002
    title: "IBAN must be masked"
    severity: high
    pattern: "\\bTR[0-9]{2}[A-Z0-9]{5}[A-Z0-9]{17}\\b|\\bIBAN\\b"
    description: "Illustrative masking guidance."
  - id: kvkk-003
    title: "Email addresses must not be persisted in raw logs"
    severity: high
    pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    description: "Illustrative logging guidance."
  - id: kvkk-004
    title: "Phone numbers require masking"
    severity: medium
    pattern: "\\+90|\\b05[0-9]{9}\\b"
    description: "Illustrative phone masking guidance."
  - id: kvkk-005
    title: "Raw customer names should not be added to telemetry"
    severity: medium
    pattern: "customerName|musteriAdi|müşteri adı"
    description: "Illustrative telemetry guidance."
  - id: kvkk-006
    title: "Consent metadata should be explicit"
    severity: low
    pattern: "consent|rıza|riza"
    description: "Illustrative consent guidance."
  - id: kvkk-007
    title: "Export files need retention metadata"
    severity: medium
    pattern: "exportCsv|downloadCustomer|customerExport"
    description: "Illustrative export guidance."
  - id: kvkk-008
    title: "Session identifiers should be scrubbed"
    severity: high
    pattern: "sessionId|JSESSIONID|authSession"
    description: "Illustrative session guidance."
  - id: kvkk-009
    title: "Address fields require masking"
    severity: medium
    pattern: "addressLine|adres|mahalle"
    description: "Illustrative address guidance."
  - id: kvkk-010
    title: "Birth date is personal data"
    severity: medium
    pattern: "birthDate|dogumTarihi|doğum tarihi"
    description: "Illustrative birth date guidance."
